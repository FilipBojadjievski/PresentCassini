<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RedMetrics · Pitch Deck</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background:#0E1015; overflow:hidden; height:100%; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #F1F5F9; }
  deck-stage { background:#0E1015; }
  deck-stage section { background:#0E1015; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <section data-label="01 Cover"><div id="s1" style="width:100%;height:100%"></div></section>
  <section data-label="02 News Hook"><div id="s2" style="width:100%;height:100%"></div></section>
  <section data-label="03 The Invisible Crisis"><div id="s3" style="width:100%;height:100%"></div></section>
  <section data-label="04 The 7-Day Window"><div id="s4" style="width:100%;height:100%"></div></section>
  <section data-label="05 Challenge 2"><div id="s5" style="width:100%;height:100%"></div></section>
  <section data-label="06 The Solution"><div id="s6" style="width:100%;height:100%"></div></section>
  <section data-label="07 Live Demo"><div id="s7" style="width:100%;height:100%"></div></section>
  <section data-label="08 Powered by Copernicus"><div id="s8" style="width:100%;height:100%"></div></section>
  <section data-label="09 Three-Point Data System"><div id="s9" style="width:100%;height:100%"></div></section>
  <section data-label="10 TideAlert Framework"><div id="s10" style="width:100%;height:100%"></div></section>
  <section data-label="11 IoT Sentinel"><div id="s11" style="width:100%;height:100%"></div></section>
  <section data-label="12 Market Gap"><div id="s12" style="width:100%;height:100%"></div></section>
  <section data-label="13 Business Model"><div id="s13" style="width:100%;height:100%"></div></section>
  <section data-label="14 Year 1 Revenue Target"><div id="s14" style="width:100%;height:100%"></div></section>
  <section data-label="15 Future Expansion"><div id="s15" style="width:100%;height:100%"></div></section>
  <section data-label="16 The Team"><div id="s16" style="width:100%;height:100%"></div></section>
  <section data-label="17 What's Next"><div id="s17" style="width:100%;height:100%"></div></section>
  <section data-label="18 Thank You"><div id="s18" style="width:100%;height:100%"></div></section>
</deck-stage>

<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="slide-components.jsx"></script>
<script type="text/babel" src="slides.jsx"></script>
<script type="text/babel" src="slide-news-hook.jsx"></script>
<script type="text/babel" src="slide-video-showcase.jsx"></script>
<script type="text/babel" src="slide-expansion.jsx"></script>
<script type="text/babel">
  const slides = [
    Slide01Cover, NewsHookSlide,
    Slide02Crisis, Slide03Window, Slide04Challenge, Slide05Solution,
    VideoShowcaseSlide,
    Slide06Copernicus, Slide07Triangle, Slide08Framework, Slide09IoT, Slide10Gap,
    Slide11Business, Slide12Revenue,
    SlideExpansion,
    Slide13Team, Slide14Next, Slide15Thanks,
  ];
  slides.forEach((Comp, i) => {
    const el = document.getElementById('s' + (i+1));
    if (el) ReactDOM.createRoot(el).render(<Comp/>);
  });
</script>
</body>
</html>
